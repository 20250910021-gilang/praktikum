<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Biodata Diri</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e0eaf5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        main {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
        }

        /* INI ADALAH CSS UNTUK FOTO PROFIL */
        .foto-profil {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #3498db;
            padding: 3px;
            margin-bottom: 15px;
        }

        header h1 {
            margin: 0 0 5px;
            font-size: 24px;
            color: #2c3e50;
        }

        header p {
            margin: 0;
            font-size: 14px;
            color: #7f8c8d;
            font-weight: 300;
        }

        hr {
            border: 0;
            height: 1px;
            background-color: #eaeaea;
            margin: 20px 0;
        }

        h2, h3 {
            font-size: 18px;
            color: #2980b9;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-weight: 600;
            color: #34495e;
            width: 45%;
            padding: 8px 0;
            vertical-align: top;
            font-size: 14px;
        }

        td {
            padding: 8px 0;
            color: #555;
            vertical-align: top;
            font-size: 14px;
        }

        article p {
            color: #555;
            line-height: 1.6;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>

    <main>
        <header>
            <!-- BAGIAN FOTO PROFIL -->
            <!-- Pastikan nama file "foto-gilang.jpg" sama persis dengan nama foto di laptop/komputer Anda -->
            <img src="fto gilang.jpeg" alt="Foto Profil Gilang" class="foto-profil">
            
            <h1>Gilang Nur Ramadhani</h1>
            <p>Mahasiswa Sistem Informasi</p>
        </header>

        <hr>

        <section>
            <h2>Informasi Pribadi</h2>
            <table>
                <tbody>
                    <tr>
                        <th>Tempat, Tgl Lahir</th>
                        <td>: Kuningan, 06 Oktober 2006</td>
                    </tr>
                    <tr>
                        <th>Jenis Kelamin</th>
                        <td>: Laki-laki</td>
                    </tr>
                    <tr>
                        <th>Alamat</th>
                        <td>: Desa Cikeusik, Kec. Cidahu, Kab. Kuningan</td>
                    </tr>
                    <tr>
                        <th>Hobi</th>
                        <td>: Bermain Game, Musik, Joging, Renang</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <hr>

        <article>
            <h3>Tentang Saya</h3>
            <p>Saya Seorang Mahasiswa Sistem Informasi.</p>
        </article>
    </main>

</body>
</html>
